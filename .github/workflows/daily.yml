# Будильник для бесплатного PythonAnywhere: раз в день будит приложение,
# чтобы бот разослал напоминания. 02:00 UTC = 09:00 Томск (UTC+7).
# Секрет репозитория (Settings → Secrets and variables → Actions): CRON_SECRET.
name: daily-reminders
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Напоминания бота
        run: |
          curl -fsS --retry 3 --retry-delay 30 -X POST \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}" "https://ilginalexander.pythonanywhere.com/cron/daily"
