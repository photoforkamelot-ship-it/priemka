# Автообновление сервера после каждой выкладки в main:
# 1) сервер сам делает git pull (/cron/deploy), 2) сайт перезапускается через API PythonAnywhere,
# 3) печатается состояние (версия, вебхук бота, справочник).
# Секреты: CRON_SECRET, PA_TOKEN (PythonAnywhere → Account → API token).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: git pull на сервере
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}" "https://ilginalexander.pythonanywhere.com/cron/deploy"; echo
      - name: Перезапуск сайта
        run: |
          curl -fsS -X POST -H "Authorization: Token ${{ secrets.PA_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/ilginalexander/webapps/ilginalexander.pythonanywhere.com/reload/"; echo
      - name: Состояние
        run: |
          sleep 15
          curl -fsS --retry 3 --retry-delay 15 -X POST -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}" "https://ilginalexander.pythonanywhere.com/cron/status"; echo
